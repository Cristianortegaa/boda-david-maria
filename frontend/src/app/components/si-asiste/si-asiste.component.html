<!-- frontend/src/app/components/si-asiste/si-asiste.component.html -->
<div class="sa-page" appEncajar>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="sa-header">
    <button class="sa-back-btn" (click)="irAInicio()" aria-label="Volver">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M12 8H4M7 4L3 8l4 4" stroke="#000" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <!-- ── Contenido centrado verticalmente ───────────────── -->
  <div class="sa-center">

    <!-- Imagen (256×202) -->
    <div class="sa-img-wrap">
      <img src="/si-asiste.png" class="sa-img" alt="">
    </div>

    <!-- Textos -->
    <div class="sa-body">
      <p class="sa-title">¡Bieeen!</p>
      <p class="sa-desc">
        <span class="sa-desc-destacado">Necesitamos que rellenes un breve formulario</span> para ayudarnos a
        organizar todo mejor y que no tengas ningún tipo de duda:
      </p>
    </div>

  </div>

  <!-- ── Botón rellenar formulario (fijo abajo) ─────────── -->
  <div class="sa-footer">
    <button class="sa-btn" (click)="irAFormulario()">
      Rellenar formulario
    </button>
  </div>

</div>
